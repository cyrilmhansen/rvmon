name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    name: workspace-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install rustfmt
        run: rustup component add rustfmt --toolchain 1.96.0
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        run: cargo test --workspace --quiet
      - name: Validate isolated fuzz manifest
        run: cargo metadata --manifest-path fuzz/Cargo.toml --no-deps --format-version 1
      - name: Run Unix smoke scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash tools/fuzz-smoke.sh
          bash tools/accessibility-smoke.sh

